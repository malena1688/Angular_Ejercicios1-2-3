<h2>Listado de usuarios</h2>

<table>
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Ciudad</th>
        </tr>
    </thead>

    <tbody>
        @for (usuario of listaUsuarios; track usuario.nombre) {
        <tr>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.edad }}</td>
            <td>{{ usuario.ciudad }}</td>
        </tr>
        }
    </tbody>
</table>
